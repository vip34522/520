<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="rose">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8507e">
<title>情书月记 · 经期记录</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
/* ==================== 主题变量 ==================== */
:root{
  --accent:#e8507e; --accent2:#ff9dbb; --accent-soft:#ffe6ef;
  --bg:#fdf6f8; --card:#ffffff; --text:#2b2030; --muted:#93889b;
  --border:#f2e6ec; --fer-soft:#e6f7ee; --fer:#10b981;
  --safe-soft:#e6f7ee; --safe:#10b981;
  --shadow:0 4px 18px rgba(232,80,126,.09);
  --radius:18px;
}
html[data-accent="violet"]{--accent:#8b5cf6;--accent2:#c4b5fd;--accent-soft:#f1ebff;--shadow:0 4px 18px rgba(139,92,246,.10);}
html[data-accent="ocean"]{--accent:#0ea5e9;--accent2:#7dd3fc;--accent-soft:#e3f5fe;--shadow:0 4px 18px rgba(14,165,233,.10);}
html[data-accent="mint"]{--accent:#10b981;--accent2:#6ee7b7;--accent-soft:#e3faf2;--shadow:0 4px 18px rgba(16,185,129,.10);}
html[data-accent="amber"]{--accent:#f59e0b;--accent2:#fcd34d;--accent-soft:#fff6e0;--shadow:0 4px 18px rgba(245,158,11,.12);}

html[data-theme="dark"]{
  --bg:#141018; --card:#1e1922; --text:#f3eaf1; --muted:#9d92a6;
  --border:#2c2436; --accent-soft:#3a2030; --fer-soft:#123326; --shadow:0 4px 18px rgba(0,0,0,.45);
}

/* ==================== 基础 ==================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#e7e0ea; color:var(--text); display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased; font-size:14px;
}
html[data-theme="dark"] body{background:#0b080e;}

#app{
  position:relative; width:100%; max-width:430px;
  height:100vh; height:100dvh; margin:0 auto;
  background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 0 50px rgba(0,0,0,.12);
}

/* ==================== 顶栏 ==================== */
.appbar{
  flex:none; display:flex; align-items:center; justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  background:var(--accent);
  color:#fff;
}
.appbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.5px;color:#fff;}
.appbar h1 small{font-weight:400;font-size:11px;color:rgba(255,255,255,.78);margin-left:6px;letter-spacing:0;}
.appbar .right{display:flex;gap:8px;align-items:center;font-size:12px;color:rgba(255,255,255,.92);}

#view{flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 16px 28px; scroll-behavior:smooth;}
#view::-webkit-scrollbar{width:0;}

/* ==================== 卡片 ==================== */
.card{
  background:var(--card); border-radius:var(--radius); padding:16px;
  margin-bottom:12px; box-shadow:var(--shadow); border:1px solid var(--border);
}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;color:var(--accent);}
.card-title .muted{font-size:11px;font-weight:400;color:var(--muted);}
.section-title{font-size:12px;color:var(--muted);margin:18px 4px 8px;font-weight:600;letter-spacing:.4px;}

/* ==================== Hero ==================== */
.hero{
  border-radius:22px; padding:18px 20px 20px; margin:4px 0 12px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  color:#fff; box-shadow:0 10px 26px -8px var(--accent); position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; right:-40px; top:-50px; width:150px; height:150px;
  border-radius:50%; background:rgba(255,255,255,.14);
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;opacity:.92;position:relative;z-index:1;}
.hero-badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 12px 4px 10px; border-radius:20px;
  font-size:11px; font-weight:700; letter-spacing:.4px;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
  border:1.5px solid currentColor;
  position:relative; z-index:2;
}
.hero-badge::before{
  content:""; width:6px; height:6px; border-radius:50%;
  background:currentColor; flex:none;
}
.hero-badge.period{ color:#d92d4a; }
.hero-badge.safe{   color:#0d8f5f; }
.hero-badge.fer{    color:#b86e00; }
html[data-theme="dark"] .hero-badge{
  background:#1e1922;
  box-shadow:0 2px 10px rgba(0,0,0,.55);
}
html[data-theme="dark"] .hero-badge.period{ color:#ff6b81; }
html[data-theme="dark"] .hero-badge.safe{   color:#34d399; }
html[data-theme="dark"] .hero-badge.fer{    color:#fbbf24; }

.hero-main{font-size:26px;font-weight:800;margin:14px 0 6px;letter-spacing:.5px;position:relative;z-index:1;}
.hero-sub{font-size:12px;opacity:.9;position:relative;z-index:1;}
.hero-bar{margin-top:14px;height:5px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;position:relative;z-index:1;}
.hero-bar i{display:block;height:100%;border-radius:6px;background:#fff;transition:width .5s;}

/* ==================== 打卡按钮 ==================== */
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quick-btn{
  border:1.5px solid var(--border); background:var(--card); border-radius:14px;
  padding:14px 8px; display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer; transition:.18s; font-family:inherit; color:var(--text);
}
.quick-btn:active{transform:scale(.96);}
.quick-btn .qb-ico{font-size:20px;}
.quick-btn .qb-t{font-size:12.5px;font-weight:600;}
.quick-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.quick-btn.on .qb-t{color:var(--accent);}
.mini-row{display:flex;gap:8px;margin-top:10px;}
.mini-btn{
  flex:1;border:1px dashed var(--border);background:transparent;border-radius:11px;
  padding:9px 6px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s;
}
.mini-btn:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.mini-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);border-style:solid;}

/* ==================== 症状 chips ==================== */
.field-label{font-size:12px;color:var(--muted);margin:10px 0 8px;font-weight:600;}
.field-label:first-child{margin-top:0;}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{
  border:1.5px solid var(--border);background:var(--card);border-radius:20px;
  padding:7px 14px;font-size:12.5px;color:var(--text);cursor:pointer;font-family:inherit;
  transition:.15s;
}
.chip:active{transform:scale(.94);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 3px 10px -3px var(--accent);}
.note-input{
  width:100%;margin-top:12px;border:1.5px solid var(--border);background:transparent;
  border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text);
  resize:none;outline:none;min-height:44px;
}
.note-input:focus{border-color:var(--accent);}

/* ==================== 预测 ==================== */
.pred-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
.pred-item{background:var(--bg);border-radius:13px;padding:11px 4px;}
.pi-label{font-size:10.5px;color:var(--muted);margin-bottom:6px;}
.pi-val{font-size:13.5px;font-weight:700;letter-spacing:-.2px;}
.pi-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.pi-val.ovu{color:var(--fer);}
.pi-val.fer{color:#f59e0b;}
.pi-val.per{color:var(--accent);}

/* ==================== 提示条 ==================== */
.tip{
  display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);
  border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.55;
}
.tip .ti{font-size:16px;line-height:1.2;}
.tip b{color:var(--accent);}

/* ==================== 日历 ==================== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-size:16px;font-weight:700;}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{
  width:30px;height:30px;border-radius:10px;border:none;background:var(--bg);
  color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.cal-nav button:active{background:var(--accent-soft);}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin-bottom:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px 0;}
.cal-cell{
  aspect-ratio:1; border:none;background:transparent;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-family:inherit;padding:0;position:relative;
}
.cal-cell span{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--text);transition:.15s;
}
.cal-cell.empty{cursor:default;}
.cal-cell.d-period span{background:var(--accent);color:#fff;font-weight:700;}
.cal-cell.d-predicted span{border:1.5px dashed var(--accent);color:var(--accent);font-weight:600;}
.cal-cell.d-fertile span{background:#fff4dc;color:#f59e0b;font-weight:600;}
.cal-cell.d-safe span{background:#e6f7ee;color:#10b981;font-weight:600;}
.cal-cell.today span{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent);}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:11px;color:var(--muted);}
.cal-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px;}
.lg-period{background:var(--accent);}
.lg-pred{border:1.5px dashed var(--accent);}
.lg-fer{background:#f59e0b;}
.lg-safe{background:#10b981;}

/* ==================== 历史 ==================== */
.rec{background:var(--card);border:1px solid var(--border);border-radius:15px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.rec-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.rec-dates{font-size:14px;font-weight:700;}
.rec-meta{font-size:11.5px;color:var(--muted);margin-top:4px;}
.rec-right{text-align:right;font-size:11px;color:var(--muted);}
.rec-right b{display:block;font-size:16px;color:var(--accent);font-weight:800;}
.rec-body{display:none;padding:0 16px 14px;border-top:1px dashed var(--border);}
.rec.open .rec-body{display:block;}
.day-row{display:flex;justify-content:space-between;padding:8px 0;font-size:12px;border-bottom:1px solid var(--border);}
.day-row:last-child{border-bottom:none;}
.day-row .dr-l{color:var(--muted);width:58px;flex:none;}
.day-row .dr-r{flex:1;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.tag{background:var(--bg);border-radius:8px;padding:2px 8px;font-size:11px;}
.tag.flow{color:var(--accent);background:var(--accent-soft);}
.tag.pain{color:var(--fer);background:var(--fer-soft);}

/* ==================== 分析 ==================== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 4px;text-align:center;box-shadow:var(--shadow);}
.stat .sv{font-size:17px;font-weight:800;color:var(--accent);}
.stat .sv small{font-size:9px;font-weight:500;color:var(--muted);margin-left:1px;}
.stat .sl{font-size:10px;color:var(--muted);margin-top:4px;}
canvas.chart{width:100%;height:140px;display:block;}
.chart-label{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.5;}

/* ==================== 设置 ==================== */
.acc-item{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;font-size:13.5px;font-weight:600;}
.acc-head .acc-arrow{font-size:12px;color:var(--muted);transition:.2s;}
.acc-item.open .acc-arrow{transform:rotate(180deg);}
.acc-body{display:none;border-top:1px solid var(--border);}
.acc-item.open .acc-body{display:block;}
.srow{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);gap:12px;}
.srow:last-child{border-bottom:none;}
.srow-main{flex:1;min-width:0;}
.srow-title{font-size:13.5px;font-weight:600;}
.srow-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:26px;transition:.25s;}
.slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider:before{transform:translateX(18px);}
.time-input{
  border:1.5px solid var(--border);background:var(--bg);border-radius:9px;padding:5px 8px;
  font-size:12px;font-family:inherit;color:var(--text);outline:none;
}
.accents{display:flex;gap:12px;padding:14px 16px;}
.acc-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.2s;}
.acc-dot.on{border-color:var(--text);transform:scale(1.08);}

/* ==================== 个人信息 ==================== */
.avatar-row{display:flex;align-items:center;gap:14px;padding:16px;}
.avatar{
  width:64px;height:64px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;flex:none;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-info{flex:1;min-width:0;}
.avatar-name-row{display:flex;align-items:center;gap:10px;}
.avatar-name{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;}
.edit-nick-btn{
  border:1px solid var(--accent);color:var(--accent);background:transparent;
  border-radius:8px;padding:2px 10px;font-size:11px;cursor:pointer;font-family:inherit;flex:none;
}
.edit-nick-btn:active{background:var(--accent-soft);}
.avatar-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;}
.info-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;
  padding:0 16px 12px;
}
.info-field{display:flex;flex-direction:column;gap:4px;min-width:0;}
.info-field label{font-size:11px;color:var(--muted);}
.info-field input{
  border:1.5px solid var(--border);background:var(--bg);border-radius:9px;
  padding:7px 9px;font-size:12.5px;font-family:inherit;color:var(--text);outline:none;
  width:100%;height:36px;box-sizing:border-box;
}
.info-field input:focus{border-color:var(--accent);}
.info-actions{
  display:flex;justify-content:flex-end;
  padding:0 16px 16px;
}
.info-actions .btn{width:auto;padding:9px 22px;font-size:13px;}

/* ==================== Tabbar ==================== */
.tabbar{
  flex:none;display:flex;background:var(--card);border-top:1px solid var(--border);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  position:relative; z-index:1;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;
  border:none;background:none;color:var(--muted);font-size:10px;cursor:pointer;font-family:inherit;
  transition:.15s;position:relative; z-index:0; isolation:isolate;
}
.tab .tab-bg{
  position:absolute; inset:3px 8px; border-radius:14px;
  background:transparent; transition:.2s; z-index:0;
}
.tab.active .tab-bg{ background:var(--accent-soft); }
.tab .ico{
  position:relative; z-index:1;
  display:flex; align-items:center; justify-content:center;
  width:22px; height:22px; color:var(--muted); transition:.15s;
}
.tab .ico svg{ width:22px; height:22px; display:block; }
.tab .tab-label{ position:relative; z-index:1; }
.tab.active{ color:var(--accent); font-weight:700; }
.tab.active .ico{ color:var(--accent); }
.tab.active::before{
  content:""; position:absolute; top:-6px; left:24%; right:24%; height:3px;
  border-radius:0 0 3px 3px; background:var(--accent); z-index:1;
}

/* ==================== 弹层 ==================== */
#sheet{position:fixed;inset:0;z-index:80;display:none;}
#sheet.show{display:block;}
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);animation:fade .2s;}
.sheet-body{
  position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;
  background:var(--card);border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  animation:up .26s cubic-bezier(.2,.9,.3,1); max-height:80vh;overflow-y:auto;
}
@keyframes up{from{transform:translate(-50%,100%);}to{transform:translate(-50%,0);}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.sheet-close{border:none;background:var(--bg);width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;}
.btn{
  width:100%;border:none;border-radius:13px;padding:13px;font-size:14px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:.15s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px -6px var(--accent);}
.btn-ghost{background:var(--bg);color:var(--text);}
.btn-danger{background:#fee;color:#e11d48;}
html[data-theme="dark"] .btn-danger{background:#3a1420;}
.btn-row{display:flex;gap:10px;margin-top:10px;}
.input-date{
  width:100%;border:1.5px solid var(--border);background:var(--bg);border-radius:12px;
  padding:12px;font-size:14px;font-family:inherit;color:var(--text);outline:none;
}
.input-date:focus{border-color:var(--accent);}
.form-label{font-size:12px;color:var(--muted);margin:14px 0 7px;font-weight:600;}
.alert-text{font-size:13px;line-height:1.7;color:var(--text);}
.alert-text .red{color:#e11d48;font-weight:700;}

/* ==================== Toast ==================== */
#toast{
  position:fixed;left:50%;bottom:90px;transform:translate(-50%,14px);
  background:rgba(40,30,45,.94);color:#fff;padding:11px 20px;border-radius:24px;
  font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:200;white-space:nowrap;
  max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ==================== 锁屏 ==================== */
#lock{
  position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;
}
#lock.show{display:flex;}
.lock-icon{font-size:44px;margin-bottom:14px;}
.lock-tip{font-size:14px;opacity:.9;margin-bottom:26px;}
.lock-dots{display:flex;gap:14px;margin-bottom:30px;}
.lock-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;transition:.2s;}
.lock-dots i.on{background:#fff;}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:250px;}
.lock-key{
  height:60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);
  color:#fff;font-size:21px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;
}
.lock-key:active{background:rgba(255,255,255,.3);transform:scale(.94);}
.lock-key.blank{border:none;background:none;pointer-events:none;}
.lock-key.fn{font-size:13px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;line-height:1.7;}
.empty-state .es-ico{font-size:40px;margin-bottom:12px;opacity:.6;}
</style>
</head>
<body>

<div id="app">
  <header class="appbar">
    <h1>情书月记<small id="abSub"></small></h1>
    <div class="right" id="abRight"></div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheet"></div>
<div id="toast"></div>

<div id="lock">
  <div class="lock-icon">🔒</div>
  <div class="lock-tip">请输入密码解锁</div>
  <div class="lock-dots" id="lockDots"></div>
  <div class="lock-pad" id="lockPad"></div>
</div>

<script>
/* ==========================================================
   工具函数
   ========================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const WEEK = ['日','一','二','三','四','五','六'];

const toKey = d =>
  d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const todayKey = () => toKey(new Date());
const fmtCN = k => { const d = parseKey(k); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
const fmtShort = k => { const d = parseKey(k); return (d.getMonth() + 1) + '/' + d.getDate(); };
const fmtFull = k => { const d = parseKey(k); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 周${WEEK[d.getDay()]}`; };
const monthOf = k => { const d = parseKey(k); return (d.getMonth() + 1) + '月'; };
const hexA = (hex, a) => {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ==========================================================
   状态 / 存储
   ========================================================== */
const STORE_KEY = 'qingshu_period_v1';

const DEFAULT_SETTINGS = {
  dark: false,
  accent: 'rose',
  lock: false,
  pin: '1234',
  profile: { avatar: '', nickname: '', birthday: '', height: '', weight: '' },
  reminders: {
    preAlert:   { on: true,  time: '09:00' },
    endAlert:   { on: true,  time: '20:00' },
    ferAlert:   { on: true,  time: '09:00' },
    safeAlert:  { on: true,  time: '09:00' },
    sexTip:     { on: true,  time: '20:00' },
    preDaily:   { on: true,  time: '09:00' },
    symptomDaily:{ on: true, time: '20:00' },
    dietTip:    { on: true,  time: '08:00' }
  }
};

function mergeDeep(base, over) {
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  if (!over) return out;
  for (const k in over) {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && base[k] && typeof base[k] === 'object') {
      out[k] = mergeDeep(base[k], over[k]);
    } else if (over[k] !== undefined) {
      out[k] = over[k];
    }
  }
  return out;
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.settings = mergeDeep(DEFAULT_SETTINGS, s.settings || {});
      s.periods = s.periods || [];
      s.symptoms = s.symptoms || {};
      s.sex = s.sex || [];
      return s;
    }
  } catch (e) { console.warn(e); }
  return seedState();
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function seedState() {
  return {
    periods: [],
    symptoms: {},
    sex: [],
    settings: mergeDeep(DEFAULT_SETTINGS, {})
  };
}

/* ==========================================================
   核心分析
   ========================================================== */
function analyze() {
  const tk = todayKey();
  const periods = state.periods
    .filter(p => p.start)
    .slice()
    .sort((a, b) => a.start < b.start ? -1 : 1);

  const cycleLens = [];
  for (let i = 1; i < periods.length; i++) {
    const L = diffDays(periods[i - 1].start, periods[i].start);
    if (L >= 15 && L <= 75) cycleLens.push(L);
  }
  const recent = cycleLens.slice(-6);
  const avgCycle = recent.length
    ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length)
    : 28;

  const plens = periods.filter(p => p.end).map(p => diffDays(p.start, p.end) + 1).filter(n => n >= 1 && n <= 15);
  const avgPeriod = plens.length
    ? Math.max(2, Math.round(plens.slice(-6).reduce((a, b) => a + b, 0) / Math.min(6, plens.length)))
    : 5;

  const last = periods.length ? periods[periods.length - 1] : null;

  const active = periods
    .filter(p => !p.end && p.start <= tk)
    .sort((a, b) => b.start.localeCompare(a.start))[0] || null;

  let nextStart = null, ferStart = null, ferEnd = null, safeEnd = null, predEnd = null;
  if (last) {
    nextStart = toKey(addDays(parseKey(last.start), avgCycle));
    const ns = parseKey(nextStart);
    ferStart = toKey(addDays(ns, -19));
    ferEnd = toKey(addDays(ns, -13));
    safeEnd = toKey(addDays(ns, -1));
    predEnd = toKey(addDays(ns, avgPeriod - 1));
  }

  let predFlowDate = null;
  if (nextStart) {
    predFlowDate = parseKey(nextStart).getDate() + '日';
  } else if (last) {
    predFlowDate = parseKey(last.start).getDate() + '日';
  }

  return { tk, periods, cycleLens, avgCycle, avgPeriod, last, active, nextStart, ferStart, ferEnd, safeEnd, predEnd, predFlowDate };
}

/* ==========================================================
   日历日映射
   ========================================================== */
function buildDayMap() {
  const map = {};
  const tk = todayKey();
  const a = analyze();

  state.periods.forEach(p => {
    if (!p.start) return;
    let end = p.end;
    if (!end) end = p.start > tk ? p.start : tk;
    const n = diffDays(p.start, end);
    for (let i = 0; i <= n; i++) {
      map[toKey(addDays(parseKey(p.start), i))] = { type: 'period' };
    }
  });

  if (!a.nextStart || a.avgCycle <= 0) return map;

  let cur = parseKey(a.nextStart);
  for (let c = 0; c < 4; c++) {
    for (let i = 0; i < a.avgPeriod; i++) {
      const k = toKey(addDays(cur, i));
      if (!map[k]) map[k] = { type: 'predicted' };
    }
    const fs = addDays(cur, -19);
    for (let i = 0; i < 7; i++) {
      const k = toKey(addDays(fs, i));
      if (!map[k]) map[k] = { type: 'fertile' };
    }
    let sk = addDays(cur, -12);
    while (sk < cur) {
      const k = toKey(sk);
      if (!map[k]) map[k] = { type: 'safe' };
      sk = addDays(sk, 1);
    }
    cur = addDays(cur, a.avgCycle);
  }

  if (a.last) {
    const lastEnd = a.last.end ? parseKey(a.last.end) : parseKey(a.last.start);
    const curFertStart = addDays(parseKey(a.nextStart), -19);
    let sk = addDays(lastEnd, 1);
    let guard = 0;
    while (sk < curFertStart && guard < 60) {
      const k = toKey(sk);
      if (!map[k]) map[k] = { type: 'safe' };
      sk = addDays(sk, 1);
      guard++;
    }
  }

  return map;
}

/* ==========================================================
   Actions
   ========================================================== */
function confirmDialog(html, onYes, opts = {}) {
  const { yesText = '确认', noText = '取消', single = false } = opts;
  openSheet(`
    <div class="sheet-title"><span>提示</span><button class="sheet-close" data-action="closeSheet">✕</button></div>
    <div class="alert-text">${html}</div>
    <div class="btn-row" style="margin-top:20px">
      ${single ? '' : `<button class="btn btn-ghost" data-action="closeSheet">${noText}</button>`}
      <button class="btn btn-primary" id="confirmYesBtn">${yesText}</button>
    </div>
  `);
  const btn = $('#confirmYesBtn');
  if (btn) btn.addEventListener('click', () => { closeSheet(); if (onYes) onYes(); });
}

function monthMarkCount(type) {
  const tk = todayKey();
  const ym = tk.slice(0, 7);
  return state.periods.filter(p => {
    if (type === 'start') return p.start && p.start.slice(0, 7) === ym;
    return p.end && p.end.slice(0, 7) === ym;
  }).length;
}

function markStart() {
  const tk = todayKey();
  if (state.periods.some(p => p.start === tk)) { toast('今天已经记录过啦 🌸'); return; }

  const cnt = monthMarkCount('start');
  const a = analyze();

  const doMark = () => {
    state.periods.push({ id: 'p' + Date.now(), start: tk, end: null });
    saveState(); render(); toast('已记录：今天来了 🌸');
  };

  if (cnt >= 2) {
    confirmDialog(
      `本月您已标记了两次【来潮】。如需修改标记，请在「记录」页面对已有经期进行编辑或删除；<br><span class="red">如真实多次来潮，请立即前往医院就医。</span>`,
      null,
      { yesText: '关闭', single: true }
    );
    return;
  }

  if (cnt === 1) {
    confirmDialog(
      `本月您已标记了【来潮】。如需修改标记，请点击底部「记录」进入历史列表编辑；是否继续标记？`,
      doMark,
      { yesText: '是', noText: '否' }
    );
    return;
  }

  let compareMsg = '本次经期如约而至。';
  if (a.nextStart) {
    const d = diffDays(a.nextStart, tk);
    if (d > 0) compareMsg = `本次经期比预测周期 <b>推迟 ${d} 天</b> 到来，注意休息哦。`;
    else if (d < 0) compareMsg = `本次经期比预测周期 <b>提前 ${-d} 天</b> 到来，注意保暖哦。`;
  }
  confirmDialog(compareMsg, doMark, { yesText: '确认', noText: '取消' });
}

function markEnd() {
  const tk = todayKey();
  const active = state.periods
    .filter(p => !p.end && p.start <= tk)
    .sort((a, b) => b.start.localeCompare(a.start))[0];
  if (!active) { toast('当前没有进行中的经期'); return; }

  const cnt = monthMarkCount('end');
  const a = analyze();
  const dur = diffDays(active.start, tk) + 1;

  const doMark = () => {
    active.end = tk;
    saveState(); render(); toast('已记录：今天走了 ✨');
  };

  if (cnt >= 2) {
    confirmDialog(
      `本月您已标记了两次【去潮】。如需修改标记，请在「记录」页面对已有经期进行编辑或删除；<br><span class="red">如真实多次来潮，请立即前往医院就医。</span>`,
      null,
      { yesText: '关闭', single: true }
    );
    return;
  }

  if (cnt === 1) {
    confirmDialog(
      `本月您已标记了【去潮】。如需修改标记，请点击底部「记录」进入历史列表编辑；是否继续标记？`,
      doMark,
      { yesText: '是', noText: '否' }
    );
    return;
  }

  let compareMsg = `本次经期持续 ${dur} 天，周期正常。`;
  if (dur > a.avgPeriod) compareMsg = `本次经期持续 ${dur} 天，比平均周期 <b>多了 ${dur - a.avgPeriod} 天</b>，注意补充营养。`;
  else if (dur < a.avgPeriod) compareMsg = `本次经期持续 ${dur} 天，比平均周期 <b>少了 ${a.avgPeriod - dur} 天</b>，正常波动无需担心。`;

  confirmDialog(compareMsg, doMark, { yesText: '确认', noText: '取消' });
}

function setSymptom(field, value) {
  const tk = todayKey();
  if (!state.symptoms[tk]) state.symptoms[tk] = { flow: null, pain: null, note: '' };
  state.symptoms[tk][field] = state.symptoms[tk][field] === value ? null : value;
  saveState(); render();
}

function setNote(val) {
  const tk = todayKey();
  if (!state.symptoms[tk]) state.symptoms[tk] = { flow: null, pain: null, note: '' };
  state.symptoms[tk].note = val;
  saveState();
}

/* ==========================================================
   页面：首页
   ========================================================== */
function renderHome() {
  const a = analyze();
  const tk = a.tk;
  const today = new Date();
  const active = a.active;
  const todaySym = state.symptoms[tk] || {};
  const markedStart = state.periods.some(p => p.start === tk);
  const markedEnd = state.periods.some(p => p.end === tk);

  let statusType = 'safe', statusText = '安全期';
  if (active) { statusType = 'period'; statusText = '月经期'; }
  else if (a.nextStart) {
    if (tk >= a.ferStart && tk <= a.ferEnd) { statusType = 'fer'; statusText = '易孕期'; }
    else { statusType = 'safe'; statusText = '安全期'; }
  }

  let heroTitle, heroSub, pct = 0;
  if (active) {
    const day = diffDays(active.start, tk) + 1;
    heroTitle = `经期第 ${day} 天`;
    heroSub = `开始于 ${fmtCN(active.start)} · 记得每天记录症状哦`;
    pct = Math.min(100, (day / Math.max(a.avgPeriod, day)) * 100);
  } else if (a.last && a.nextStart) {
    const d = diffDays(tk, a.nextStart);
    if (d > 0) { heroTitle = `距下次月经还有 ${d} 天`; heroSub = `预计 ${fmtCN(a.nextStart)} 来潮 · 平均周期 ${a.avgCycle} 天`; }
    else if (d === 0) { heroTitle = '预计今天来月经'; heroSub = '来了的话记得点「今天来了」标记准确时间'; }
    else { heroTitle = `月经已推迟 ${-d} 天`; heroSub = '作息、压力都可能影响周期，别太焦虑 💗'; }
    pct = Math.min(100, ((diffDays(a.last.start, tk) + 1) / a.avgCycle) * 100);
  } else {
    heroTitle = '欢迎使用情书月记'; heroSub = '点击下方「今天来了」记录第一次经期'; pct = 0;
  }

  let predHTML = '';
  if (a.nextStart) {
    const dNext = diffDays(tk, a.nextStart);
    const dFer = diffDays(tk, a.ferStart);
    const dSafe = diffDays(tk, a.safeEnd);
    const safeStartKey = toKey(addDays(parseKey(a.ferEnd), 1));

    let dSafeText = '';
    if (tk >= safeStartKey && tk <= a.safeEnd) {
      dSafeText = '当前安全期中';
    } else if (a.last && a.last.end && tk >= toKey(addDays(parseKey(a.last.end), 1)) && tk < a.ferStart) {
      dSafeText = '当前安全期中';
    } else {
      dSafeText = dSafe > 0 ? dSafe + '天后' : dSafe === 0 ? '今天' : '已过' + (-dSafe) + '天';
    }
    
    predHTML = `
      <div class="pred-grid">
        <div class="pred-item">
          <div class="pi-label">下次月经</div>
          <div class="pi-val per">${fmtShort(a.nextStart)}</div>
          <div class="pi-sub">${dNext > 0 ? dNext + '天后' : dNext === 0 ? '今天' : '已过' + (-dNext) + '天'}</div>
        </div>
        <div class="pred-item">
          <div class="pi-label">下次易孕期</div>
          <div class="pi-val fer">${fmtShort(a.ferStart)}-${fmtShort(a.ferEnd)}</div>
          <div class="pi-sub">${dFer > 0 ? dFer + '天后' : dFer === 0 ? '今天' : '已过' + (-dFer) + '天'}</div>
        </div>
        <div class="pred-item">
          <div class="pi-label">下次安全期</div>
          <div class="pi-val ovu">${fmtShort(safeStartKey)}-${fmtShort(a.safeEnd)}</div>
          <div class="pi-sub">${dSafeText}</div>
        </div>
      </div>`;
  } else {
    predHTML = `<div class="empty-state" style="padding:16px 0"><div class="es-ico">📈</div>记录 2 次以上经期后，将自动生成预测</div>`;
  }

  const inPeriod = !!active;
  const flowChips = ['无', '少量', '中等', '较多'].map((t, i) =>
    `<button class="chip ${todaySym.flow === i ? 'on' : ''}" data-action="flow" data-v="${i}">${t}</button>`).join('');
  const painChips = ['无', '轻微', '中等', '严重'].map((t, i) =>
    `<button class="chip ${todaySym.pain === i ? 'on' : ''}" data-action="pain" data-v="${i}">${t}</button>`).join('');

  const symptomCard = `
    <div class="card">
      <div class="card-title">今日症状打卡 <span class="muted">${inPeriod ? '经期第 ' + (diffDays(active.start, tk) + 1) + ' 天' : fmtCN(tk)}</span></div>
      <div class="field-label">🩸 血量情况</div>
      <div class="chips">${flowChips}</div>
      <div class="field-label">💢 肚疼程度</div>
      <div class="chips">${painChips}</div>
      <textarea class="note-input" id="noteBox" placeholder="备注：情绪 / 腰酸 / 用药…">${todaySym.note || ''}</textarea>
    </div>`;

  let dietTip = '';
  if (active) {
    dietTip = `<div class="tip"><span class="ti">🍲</span><div><b>经期注意：</b>多喝温水，补充含铁食物（红枣、瘦肉、菠菜），避免生冷辛辣与剧烈运动，注意保暖。</div></div>`;
  } else if (a.nextStart) {
    const d = diffDays(tk, a.nextStart);
    if (d >= 0 && d <= 3) dietTip = `<div class="tip"><span class="ti">🧣</span><div><b>经期将至：</b>提前保暖，减少咖啡因与生冷食物，备好卫生用品，保持规律作息。</div></div>`;
    else if (a.last && a.last.end && diffDays(a.last.end, tk) <= 5) dietTip = `<div class="tip"><span class="ti">🫖</span><div><b>经期刚结束：</b>气血需要补充，可适量吃红枣、桂圆、动物肝脏，避免马上剧烈运动。</div></div>`;
    else if (statusType === 'fer') dietTip = `<div class="tip"><span class="ti">💛</span><div><b>易孕期：</b>受孕概率较高，注意休息，均衡饮食，如有备孕计划可适当同房。</div></div>`;
    else dietTip = `<div class="tip"><span class="ti">🥗</span><div><b>安全期：</b>身体状态稳定，保持均衡饮食与适量运动，心情愉快最重要。</div></div>`;
  } else {
    dietTip = `<div class="tip"><span class="ti">📝</span><div><b>欢迎使用情书月记：</b>点击下方「今天来了」记录第一次经期，之后会自动为你推算安全期与易孕期。</div></div>`;
  }

  return `
    <div class="hero">
      <div class="hero-top">
        <span>${today.getMonth() + 1}月${today.getDate()}日 周${WEEK[today.getDay()]}</span>
        <span class="hero-badge ${statusType}">${statusText}</span>
      </div>
      <div class="hero-main">${heroTitle}</div>
      <div class="hero-sub">${heroSub}</div>
      <div class="hero-bar"><i style="width:${pct}%"></i></div>
    </div>

    ${dietTip}

    <div class="card">
      <div class="card-title">今日打卡 <button class="mini-btn" style="flex:none;padding:5px 12px;font-size:11px" data-action="editLast">修改</button></div>
      <div class="quick-row">
        <button class="quick-btn ${markedStart ? 'on' : ''}" data-action="markStart">
          <span class="qb-ico">🌸</span><span class="qb-t">今天来了</span>
        </button>
        <button class="quick-btn ${markedEnd ? 'on' : ''}" data-action="markEnd">
          <span class="qb-ico">✨</span><span class="qb-t">今天走了</span>
        </button>
      </div>
    </div>

    ${symptomCard}

    <div class="card">
      <div class="card-title">周期预测 <span class="muted">基于近 6 次记录</span></div>
      ${predHTML}
    </div>
  `;
}

/* ==========================================================
   页面：日历
   ========================================================== */
let calMonth = (() => { const d = new Date(); d.setDate(1); return d; })();

function renderCalendar() {
  const map = buildDayMap();
  const a = analyze();
  const tk = todayKey();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();

  const first = new Date(y, m, 1);
  let lead = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const info = map[key];
    const cls = info ? 'd-' + info.type : '';
    const isToday = key === tk;
    cells += `<button class="cal-cell ${cls} ${isToday ? 'today' : ''}" data-action="dayClick" data-date="${key}"><span>${d}</span></button>`;
  }

  const weekHead = ['一','二','三','四','五','六','日'].map(w => `<div>${w}</div>`).join('');

  const curMonth = tk.slice(0, 7);
  const curPeriod = state.periods.filter(p => p.start && p.start.slice(0, 7) === curMonth)
    .sort((a, b) => b.start.localeCompare(a.start))[0];

  const closedCur = curPeriod && curPeriod.end;
  const startedCur = !!curPeriod;

  const prevPlens = state.periods.filter(p => p.end && p.start.slice(0, 7) < curMonth)
    .map(p => diffDays(p.start, p.end) + 1).filter(n => n >= 1 && n <= 15);
  const avgPrevPlen = prevPlens.length ? Math.round(prevPlens.reduce((a, b) => a + b, 0) / prevPlens.length) : null;

  const prevCycles = [];
  const sorted = state.periods.filter(p => p.start).sort((a, b) => a.start.localeCompare(b.start));
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i].start.slice(0, 7) < curMonth) {
      const L = diffDays(sorted[i - 1].start, sorted[i].start);
      if (L >= 15 && L <= 75) prevCycles.push(L);
    }
  }
  const avgPrevCycle = prevCycles.length ? Math.round(prevCycles.reduce((a, b) => a + b, 0) / prevCycles.length) : null;

  const sumFlow = (monthPrefix) => {
    let s = 0;
    Object.entries(state.symptoms).forEach(([k, v]) => {
      if (k.slice(0, 7) === monthPrefix && v.flow != null) s += v.flow;
    });
    return s;
  };
  const sumPain = (monthPrefix) => {
    let s = 0;
    Object.entries(state.symptoms).forEach(([k, v]) => {
      if (k.slice(0, 7) === monthPrefix && v.pain != null) s += v.pain;
    });
    return s;
  };
  const curFlow = sumFlow(curMonth);
  const prevFlowAvg = (() => {
    const months = new Set(Object.keys(state.symptoms).map(k => k.slice(0, 7)));
    months.delete(curMonth);
    if (!months.size) return null;
    let total = 0;
    months.forEach(m => total += sumFlow(m));
    return total / months.size;
  })();
  const curPain = sumPain(curMonth);
  const prevPainAvg = (() => {
    const months = new Set(Object.keys(state.symptoms).map(k => k.slice(0, 7)));
    months.delete(curMonth);
    if (!months.size) return null;
    let total = 0;
    months.forEach(m => total += sumPain(m));
    return total / months.size;
  })();

  const periodCompare = (() => {
    if (!closedCur) return { text: '—', cls: 'gray' };
    const d = diffDays(curPeriod.start, curPeriod.end) + 1;
    if (avgPrevPlen == null) return { text: '首次记录', cls: 'gray' };
    const diff = d - avgPrevPlen;
    if (diff === 0) return { text: '持平', cls: 'gray' };
    return { text: (diff > 0 ? '多' : '少') + Math.abs(diff) + '天', cls: diff > 0 ? 'red' : 'green' };
  })();

  const cycleCompare = (() => {
    if (!startedCur) return { text: '—', cls: 'gray' };
    const idx = sorted.indexOf(curPeriod);
    if (idx < 1) return { text: '首次记录', cls: 'gray' };
    const d = diffDays(sorted[idx - 1].start, curPeriod.start);
    if (avgPrevCycle == null) return { text: '首次记录', cls: 'gray' };
    const diff = d - avgPrevCycle;
    if (diff === 0) return { text: '持平', cls: 'gray' };
    return { text: (diff > 0 ? '多' : '少') + Math.abs(diff) + '天', cls: diff > 0 ? 'red' : 'green' };
  })();

  const flowCompare = (() => {
    if (!closedCur || prevFlowAvg == null) return { text: '—', cls: 'gray' };
    const diff = curFlow - prevFlowAvg;
    if (Math.abs(diff) < 0.5) return { text: '持平', cls: 'gray' };
    return { text: diff > 0 ? '增加' : '减少', cls: diff > 0 ? 'red' : 'green' };
  })();

  const painCompare = (() => {
    if (!closedCur || prevPainAvg == null) return { text: '—', cls: 'gray' };
    const diff = curPain - prevPainAvg;
    if (Math.abs(diff) < 0.5) return { text: '持平', cls: 'gray' };
    return { text: diff > 0 ? '增加' : '减少', cls: diff > 0 ? 'red' : 'green' };
  })();

  const cmpColor = cls => cls === 'red' ? 'var(--accent)' : cls === 'green' ? 'var(--fer)' : 'var(--muted)';

  return `
    <div class="card" style="padding:16px 14px;">
      <div class="cal-head">
        <div class="cal-title">${y}年${m + 1}月</div>
        <div class="cal-nav">
          <button data-action="calPrev">‹</button>
          <button data-action="calToday" style="width:auto;padding:0 10px;font-size:12px;">今天</button>
          <button data-action="calNext">›</button>
        </div>
      </div>
      <div class="cal-week">${weekHead}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend">
        <span><i class="lg-period"></i>经期</span>
        <span><i class="lg-pred"></i>预测经期</span>
        <span><i class="lg-fer"></i>易孕期</span>
        <span><i class="lg-safe"></i>安全期</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">本月概览 <span class="muted">与往月平均对比</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="background:var(--bg);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:10.5px;color:var(--muted);margin-bottom:6px">经期</div>
          <div style="font-size:14px;font-weight:800;color:${cmpColor(periodCompare.cls)}">${periodCompare.text}</div>
        </div>
        <div style="background:var(--bg);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:10.5px;color:var(--muted);margin-bottom:6px">周期</div>
          <div style="font-size:14px;font-weight:800;color:${cmpColor(cycleCompare.cls)}">${cycleCompare.text}</div>
        </div>
        <div style="background:var(--bg);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:10.5px;color:var(--muted);margin-bottom:6px">血量</div>
          <div style="font-size:14px;font-weight:800;color:${cmpColor(flowCompare.cls)}">${flowCompare.text}</div>
        </div>
        <div style="background:var(--bg);border-radius:12px;padding:12px;text-align:center">
          <div style="font-size:10.5px;color:var(--muted);margin-bottom:6px">肚疼</div>
          <div style="font-size:14px;font-weight:800;color:${cmpColor(painCompare.cls)}">${painCompare.text}</div>
        </div>
      </div>
    </div>

    <div class="tip"><span class="ti">💡</span><div>点击日历中的任意日期，可查看当天状态并快速记录经期。</div></div>
  `;
}

let expandedRec = null;

function renderHistory() {
  const a = analyze();
  const list = state.periods.slice().sort((x, y) => y.start.localeCompare(x.start));

  if (!list.length) {
    return `<div class="empty-state"><div class="es-ico">📋</div>还没有任何经期记录<br>回到首页点击「今天来了」开始记录吧</div>`;
  }

  const html = list.map((p) => {
    const i = a.periods.indexOf(p);
    const dur = p.end ? diffDays(p.start, p.end) + 1 : (diffDays(p.start, a.tk) + 1);
    let cycle = '—';
    if (i > 0) cycle = diffDays(a.periods[i - 1].start, p.start);
    const open = expandedRec === p.id;

    let days = '';
    const endK = p.end || a.tk;
    const n = Math.max(0, diffDays(p.start, endK));
    for (let d = 0; d <= n; d++) {
      const k = toKey(addDays(parseKey(p.start), d));
      const s = state.symptoms[k];
      if (!s || (s.flow == null && s.pain == null && !s.note)) continue;
      const flowTxt = ['无', '少量', '中等', '较多'][s.flow] || '';
      const painTxt = ['无', '轻微', '中等', '严重'][s.pain] || '';
      days += `<div class="day-row">
        <div class="dr-l">第 ${d + 1} 天</div>
        <div class="dr-r">
          ${s.flow != null ? `<span class="tag flow">血量 ${flowTxt}</span>` : ''}
          ${s.pain != null ? `<span class="tag pain">肚疼 ${painTxt}</span>` : ''}
          ${s.note ? `<span class="tag">${s.note}</span>` : ''}
        </div>
      </div>`;
    }
    if (!days) days = '<div style="padding:12px 0;color:var(--muted);font-size:12px">暂无每日症状记录</div>';

    return `
      <div class="rec ${open ? 'open' : ''}">
        <div class="rec-head" data-action="toggleRec" data-id="${p.id}">
          <div>
            <div class="rec-dates">${fmtCN(p.start)} — ${p.end ? fmtCN(p.end) : '进行中'}</div>
            <div class="rec-meta">持续 ${dur} 天 · 周期 ${cycle === '—' ? '—' : cycle + ' 天'}</div>
          </div>
          <div class="rec-right"><b>${dur}</b>天</div>
        </div>
        <div class="rec-body">
          ${days}
          <div class="btn-row">
            <button class="btn btn-ghost" data-action="editPeriod" data-id="${p.id}">修改</button>
            <button class="btn btn-danger" data-action="delPeriod" data-id="${p.id}">删除</button>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-title">导出与分享</div>
      <div class="btn-row" style="margin-top:0">
        <button class="btn btn-ghost" data-action="exportCsv">CSV</button>
        <button class="btn btn-ghost" data-action="exportPdf">PDF</button>
        <button class="btn btn-ghost" data-action="exportImg">图片</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6">
        CSV 可直接下载到本地；PDF / 图片生成后可长按保存或转发到微信。
      </div>
    </div>
    ${html}
  `;
}

function getLast6Periods() {
  return state.periods.filter(p => p.start).sort((a, b) => a.start.localeCompare(b.start)).slice(-6);
}

function drawCharts() {
  const accent = cssVar('--accent') || '#e8507e';
  const fer = cssVar('--fer') || '#10b981';
  const a = analyze();

  const last6 = getLast6Periods();

  const flowDates = last6.map(p => parseKey(p.start).getDate());
  const flowLabels = last6.map(p => monthOf(p.start));
  drawChart('chartFlowDate', flowDates, accent, { labels: flowLabels, showValues: true, unit: '日' });

  const cycles = [];
  const allSorted = state.periods.filter(p => p.start).sort((a, b) => a.start.localeCompare(b.start));
  const last6Idx = allSorted.slice(-6);
  last6Idx.forEach(p => {
    const i = allSorted.indexOf(p);
    if (i > 0) {
      const L = diffDays(allSorted[i - 1].start, p.start);
      if (L >= 15 && L <= 75) cycles.push(L);
    }
  });
  drawChart('chartCycle', cycles, accent, { showValues: true, unit: '天' });

  const flowCounts = [], flowMonths = [], painCounts = [], painMonths = [];
  last6.forEach(p => {
    const endK = p.end || a.tk;
    let fc = 0, pc = 0;
    const n = Math.max(0, diffDays(p.start, endK));
    for (let d = 0; d <= n; d++) {
      const k = toKey(addDays(parseKey(p.start), d));
      const s = state.symptoms[k];
      if (s) {
        if (s.flow >= 2) fc++;
        if (s.pain >= 2) pc++;
      }
    }
    flowCounts.push(fc); flowMonths.push(monthOf(p.start));
    painCounts.push(pc); painMonths.push(monthOf(p.start));
  });

  drawChart('chartFlow', flowCounts, accent, { labels: flowMonths, showValues: true, unit: '次' });
  drawChart('chartPain', painCounts, fer, { labels: painMonths, showValues: true, unit: '次' });

  const lf = $('#labelFlow'), lp = $('#labelPain');
  if (lf) lf.textContent = '统计：血量中等 + 较多次数累计';
  if (lp) lp.textContent = '统计：肚疼中等 + 严重次数累计';
}

function drawChart(id, values, color, opts = {}) {
  const cv = document.getElementById(id);
  if (!cv) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || 300;
  const h = 140;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const padL = 30, padR = 14, padT = 22, padB = 24;
  const cw = Math.max(10, w - padL - padR);
  const ch = Math.max(10, h - padT - padB);

  if (!values || !values.length) {
    ctx.fillStyle = cssVar('--muted') || '#999';
    ctx.font = '12px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据', w / 2, h / 2);
    return;
  }

  let lo = Math.min(...values), hi = Math.max(...values);
  if (hi - lo < 2) hi = lo + 2;
  const pad = (hi - lo) * 0.2;
  lo -= pad; hi += pad;

  const X = i => padL + (values.length === 1 ? cw / 2 : cw * i / (values.length - 1));
  const Y = v => padT + ch - ch * (v - lo) / (hi - lo);

  ctx.strokeStyle = 'rgba(150,140,160,.16)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = padT + ch * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
  }

  const grad = ctx.createLinearGradient(0, padT, 0, padT + ch);
  grad.addColorStop(0, hexA(color, 0.3));
  grad.addColorStop(1, hexA(color, 0));
  ctx.beginPath();
  ctx.moveTo(X(0), Y(values[0]));
  values.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
  ctx.lineTo(X(values.length - 1), padT + ch);
  ctx.lineTo(X(0), padT + ch);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  values.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  values.forEach((v, i) => {
    ctx.beginPath();
    ctx.arc(X(i), Y(v), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  if (opts.showValues) {
    ctx.fillStyle = color;
    ctx.font = '600 10px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    values.forEach((v, i) => ctx.fillText(v + (opts.unit || ''), X(i), Y(v) - 9));
  }

  if (opts.labels && opts.labels.length === values.length) {
    ctx.fillStyle = cssVar('--muted') || '#999';
    ctx.font = '10px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    opts.labels.forEach((lb, i) => ctx.fillText(lb, X(i), h - 6));
  }
}

   导出：CSV
   ========================================================== */
function exportCsv() {
  const rows = [['开始日期', '结束日期', '持续天数', '周期天数', '每日症状']];
  const ps = state.periods.slice().sort((a, b) => a.start.localeCompare(b.start));
  ps.forEach((p, i) => {
    const dur = p.end ? diffDays(p.start, p.end) + 1 : '';
    const cyc = i > 0 ? diffDays(ps[i - 1].start, p.start) : '';
    const details = [];
    if (p.end) {
      const n = diffDays(p.start, p.end);
      for (let d = 0; d <= n; d++) {
        const k = toKey(addDays(parseKey(p.start), d));
        const s = state.symptoms[k];
        if (s && (s.flow != null || s.pain != null)) {
          details.push(`${k}:血量${['无','少量','中等','较多'][s.flow] || '-'}/肚疼${['无','轻微','中等','严重'][s.pain] || '-'}`);
        }
      }
    }
    rows.push([p.start, p.end || '进行中', dur, cyc, details.join(' | ')]);
  });

  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `情书月记-经期记录-${todayKey()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('CSV 已导出 ✅');
}

/* ==========================================================
   导入：CSV
   ========================================================== */
function importCsv() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.csv';
  inp.onchange = () => {
    const f = inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = (evt) => {
      try {
        const text = evt.target.result.replace(/^\uFEFF/, ''); // 移除BOM
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) {
          confirmDialog('导入失败：文件内容为空或缺少数据行', null, { single: true, yesText: '关闭' });
          return;
        }
        
        // 校验表头
        const header = lines[0].split(',').map(h => h.replace(/^"|"$/g, ''));
        if (header[0] !== '开始日期' || header[1] !== '结束日期' || header[4] !== '每日症状') {
          confirmDialog('导入失败：CSV 表格格式与导出格式不一致，请使用本软件导出的 CSV 文件。', null, { single: true, yesText: '关闭' });
          return;
        }
        
        const newPeriods = [];
        const newSymptoms = {};
        let hasError = false;
        
        for (let i = 1; i < lines.length; i++) {
          // 匹配每行被双引号包裹的字段
          const parts = lines[i].split('","').map(p => p.replace(/^"|"$/g, ''));
          if (parts.length < 5) { hasError = true; break; }
          
          const st = parts[0];
          const en = parts[1] === '进行中' ? null : parts[1];
          if (!/^\d{4}-\d{2}-\d{2}$/.test(st)) { hasError = true; break; }
          
          newPeriods.push({
            id: 'p' + Date.now() + i,
            start: st,
            end: en
          });
          
          const symStr = parts[4];
          if (symStr && symStr !== '—') {
            symStr.split(' | ').forEach(item => {
              const match = item.match(/^(\d{4}-\d{2}-\d{2}):血量(.*?)\/肚疼(.*)$/);
              if (match) {
                const date = match[1];
                const flowTxt = match[2];
                const painTxt = match[3];
                const flow = ['无', '少量', '中等', '较多'].indexOf(flowTxt);
                const pain = ['无', '轻微', '中等', '严重'].indexOf(painTxt);
                newSymptoms[date] = {
                  flow: flow !== -1 ? flow : null,
                  pain: pain !== -1 ? pain : null,
                  note: ''
                };
              }
            });
          }
        }
        
        if (hasError || newPeriods.length === 0) {
          confirmDialog('导入失败：CSV 内容无法解析或格式有误。', null, { single: true, yesText: '关闭' });
          return;
        }
        
        confirmDialog(`成功识别 ${newPeriods.length} 条经期记录，是否覆盖当前数据？（此操作不可恢复）`, () => {
          state.periods = newPeriods;
          state.symptoms = newSymptoms;
          state.sex = []; // 重置同房记录
          saveState(); render(); toast('数据导入成功 ✅');
        }, { yesText: '确定覆盖', noText: '取消' });
        
      } catch (err) {
        confirmDialog('导入失败：文件无法读取或解析报错。', null, { single: true, yesText: '关闭' });
      }
    };
    r.readAsText(f, 'utf-8');
  };
  inp.click();
}

async function exportPdf() {
  if (!window.html2canvas || !window.jspdf) { toast('导出组件未加载，请检查网络后重试'); return; }
  toast('正在生成 PDF…');
  const box = _mountReportBox();
  try {
    const canvas = await html2canvas(box, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');

    const pageW = 210, pageH = 297, margin = 10;
    const imgW = pageW - margin * 2;
    const imgH = imgW * canvas.height / canvas.width;
    const pageContentH = pageH - margin * 2;

    let heightLeft = imgH;
    let position = margin;
    pdf.addImage(imgData, 'JPEG', margin, position, imgW, imgH);
    heightLeft -= pageContentH;

    while (heightLeft > 0) {
      position = margin - (imgH - heightLeft);
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', margin, position, imgW, imgH);
      heightLeft -= pageContentH;
    }

    pdf.save(`情书月记-经期报告-${todayKey()}.pdf`);
    toast('PDF 已导出 ✅');
  } catch (e) {
    toast('导出失败：' + e.message);
  } finally {
    box.remove();
  }
}

/* ==========================================================
   事件绑定
   ========================================================== */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) {
    const t = tabBtn.dataset.tab;
    if (t !== tab) { tab = t; $('#view').scrollTop = 0; render(); }
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  switch (a) {
    case 'markStart': markStart(); break;
    case 'markEnd': markEnd(); break;
    case 'editLast': showEditSheet(); break;

    case 'flow': setSymptom('flow', Number(el.dataset.v)); break;
    case 'pain': setSymptom('pain', Number(el.dataset.v)); break;

    case 'calPrev': calMonth.setMonth(calMonth.getMonth() - 1); render(); break;
    case 'calNext': calMonth.setMonth(calMonth.getMonth() + 1); render(); break;
    case 'calToday': { const d = new Date(); d.setDate(1); calMonth = d; render(); break; }
    case 'dayClick': showDaySheet(el.dataset.date); break;
    case 'closeSheet': closeSheet(); break;

    case 'dayMarkStart': {
      const k = el.dataset.date;
      if (state.periods.some(p => p.start === k)) { toast('这天已有记录'); break; }
      state.periods.push({ id: 'p' + Date.now(), start: k, end: null });
      saveState(); closeSheet(); render(); toast('已标记经期开始 🌸');
      break;
    }
    case 'dayMarkEnd': {
      const k = el.dataset.date;
      const active = state.periods.filter(p => !p.end && p.start <= k)
        .sort((x, y) => y.start.localeCompare(x.start))[0];
      if (!active) { toast('该日期之前没有进行中的经期'); break; }
      active.end = k;
      saveState(); closeSheet(); render(); toast('已标记经期结束 ✨');
      break;
    }

    case 'toggleRec':
      expandedRec = expandedRec === el.dataset.id ? null : el.dataset.id;
      render();
      break;

    case 'editPeriod': showEditSheet(el.dataset.id); break;

    case 'saveEdit': {
      const id = el.dataset.id;
      const p = state.periods.find(x => x.id === id);
      if (!p) break;
      const st = $('#edStart').value;
      const en = $('#edEnd').value;
      if (!st) { toast('请选择开始日期'); break; }
      if (en && en < st) { toast('结束日期不能早于开始日期'); break; }
      p.start = st; p.end = en || null;
      saveState(); closeSheet(); render(); toast('已保存修改 ✅');
      break;
    }

    case 'delPeriod': {
      const id = el.dataset.id;
      confirmDialog('确定删除这条经期记录吗？', () => {
        state.periods = state.periods.filter(x => x.id !== id);
        saveState(); render(); toast('已删除');
      }, { yesText: '删除', noText: '取消' });
      break;
    }

    case 'exportCsv': exportCsv(); break;
    case 'importCsv': importCsv(); break;
    case 'exportPdf': exportPdf(); break;
    case 'exportImg': exportImg(); break;

    case 'pickAccent':
      state.settings.accent = el.dataset.v;
      saveState(); applyTheme(); render();
      break;

    case 'toggleAcc': {
      const id = el.dataset.acc;
      openAcc = openAcc === id ? null : id;
      render();
      break;
    }

    case 'changePin': {
      const np = prompt('请输入新的 4 位数字密码', state.settings.pin);
      if (np && /^\d{4}$/.test(np)) {
        state.settings.pin = np; saveState(); toast('密码已更新 ✅');
      } else if (np) toast('请输入 4 位数字');
      break;
    }

    case 'uploadAvatar': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = () => {
        const f = inp.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          state.settings.profile.avatar = r.result;
          saveState(); render(); toast('头像已更新 ✅');
        };
        r.readAsDataURL(f);
      };
      inp.click();
      break;
    }

    case 'editNickname': {
      const cur = state.settings.profile.nickname || '';
      openSheet(`
        <div class="sheet-title">
          <span>修改昵称</span>
          <button class="sheet-close" data-action="closeSheet">✕</button>
        </div>
        <div class="form-label">昵称</div>
        <input type="text" class="input-date" id="nickInput" value="${cur}" placeholder="请输入昵称" maxlength="20">
        <div class="btn-row" style="margin-top:18px">
          <button class="btn btn-ghost" data-action="closeSheet">取消</button>
          <button class="btn btn-primary" data-action="saveNickname">保存</button>
        </div>
      `);
      break;
    }

    case 'saveNickname': {
      const v = ($('#nickInput').value || '').trim();
      state.settings.profile.nickname = v;
      saveState(); closeSheet(); render(); toast('昵称已更新 ✅');
      break;
    }

    case 'saveProfile': {
      const p = state.settings.profile;
      p.birthday = $('#pfBirth').value;
      p.height = $('#pfHeight').value;
      p.weight = $('#pfWeight').value;
      saveState(); render(); toast('信息已保存 ✅');
      break;
    }
    
    case 'pickBirth': {
      const cur = state.settings.profile.birthday || '';
      let y = 1995, m = 1, d = 1;
      if (cur) {
        const [cy, cm, cd] = cur.split('-').map(Number);
        y = cy; m = cm; d = cd;
      }
      
      let optsY = '';
      for (let i = 2024; i >= 1940; i--) optsY += `<option value="${i}" ${i === y ? 'selected' : ''}>${i}年</option>`;
      let optsM = '';
      for (let i = 1; i <= 12; i++) optsM += `<option value="${i}" ${i === m ? 'selected' : ''}>${i}月</option>`;
      let optsD = '';
      for (let i = 1; i <= 31; i++) optsD += `<option value="${i}" ${i === d ? 'selected' : ''}>${i}日</option>`;
      
      openSheet(`
        <div class="sheet-title"><span>选择生日</span><button class="sheet-close" data-action="closeSheet">✕</button></div>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
          <select id="birthY" class="input-date" style="flex:1; padding:10px 8px;">${optsY}</select>
          <select id="birthM" class="input-date" style="flex:1; padding:10px 8px;">${optsM}</select>
          <select id="birthD" class="input-date" style="flex:1; padding:10px 8px;">${optsD}</select>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" data-action="closeSheet">取消</button>
          <button class="btn btn-primary" data-action="saveBirth">确定</button>
        </div>
      `);
      break;
    }

    case 'saveBirth': {
      const y = $('#birthY').value;
      const m = $('#birthM').value.padStart(2, '0');
      const d = $('#birthD').value.padStart(2, '0');
      const dateStr = `${y}-${m}-${d}`;
      
      const dt = new Date(dateStr);
      if (dt.getMonth() + 1 !== Number(m)) { toast('该日期不存在'); break; }
      
      $('#pfBirth').value = dateStr;
      const age = (() => {
        const b = new Date(dateStr), n = new Date();
        let a = n.getFullYear() - b.getFullYear();
        const md = (n.getMonth() - b.getMonth()) * 100 + (n.getDate() - b.getDate());
        if (md < 0) a--;
        return a >= 0 ? a + ' 岁' : '';
      })();
      $('#pfAge').value = age;
      
      closeSheet();
      break;
    }

    case 'resetAll':
      confirmDialog('确定清空所有数据？此操作不可恢复', () => {
        localStorage.removeItem(STORE_KEY);
        state = seedState();
        saveState(); render(); toast('已恢复初始状态');
      }, { yesText: '确定', noText: '取消' });
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) {
    const path = t.dataset.toggle.split('.');
    let o = state;
    for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = t.checked;
    saveState();
syncNativeReminders();
    applyTheme();
    if (path[1] === 'dark') render();
    return;
  }
  const tm = e.target.closest('[data-time]');
  if (tm) {
    state.settings.reminders[tm.dataset.time].time = tm.value;
    saveState();
syncNativeReminders();
  }
});

/* ==========================================================
   锁屏
   ========================================================== */
let pinBuf = '';

function showLock(force) {
  if (!force && !state.settings.lock) return;
  pinBuf = '';
  updateLockDots();
  $('#lock').classList.add('show');
  renderLockPad();
}
function hideLock() { $('#lock').classList.remove('show'); }
function updateLockDots() {
  $('#lockDots').innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join('');
}
function renderLockPad() {
  const keys = ['1','2','3','4','5','6','7','8','9','bio','0','del'];
  $('#lockPad').innerHTML = keys.map(k => {
    if (k === 'bio') return `<button class="lock-key fn" data-lock="bio">👆</button>`;
    if (k === 'del') return `<button class="lock-key fn" data-lock="del">⌫</button>`;
    return `<button class="lock-key" data-lock="${k}">${k}</button>`;
  }).join('');
}
$('#lockPad').addEventListener('click', e => {
  const b = e.target.closest('[data-lock]');
  if (!b) return;
  const k = b.dataset.lock;
  if (k === 'bio') { hideLock(); toast('指纹解锁成功 👆'); return; }
  if (k === 'del') { pinBuf = pinBuf.slice(0, -1); updateLockDots(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k;
  updateLockDots();
  if (pinBuf.length === 4) {
    setTimeout(() => {
      if (pinBuf === state.settings.pin) { hideLock(); toast('解锁成功 💗'); }
      else { pinBuf = ''; updateLockDots(); toast('密码错误，请重试'); }
    }, 140);
  }
});

/* ==========================================================
   启动
   ========================================================== */
(function init() {
  applyTheme();
  render();
  if (state.settings.lock) showLock(false);

  const tk = todayKey();
  if (!state.symptoms[tk]) {
    const a = analyze();
    if (a.active) {
      state.symptoms[tk] = { flow: 2, pain: 1, note: '' };
      saveState();
      render();
    }
  }
})();

function syncNativeReminders() {
  if (window.AndroidBridge && window.AndroidBridge.setReminder) {
    const r = state.settings.reminders.symptomDaily;
    if (r.on) {
      const time = r.time.split(':');
      window.AndroidBridge.setReminder(parseInt(time[0]), parseInt(time[1]), "情书月记", "记得记录今天的症状哦 💗");
    } else {
      window.AndroidBridge.cancelReminder();
    }
  }
}

</script>
